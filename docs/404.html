<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 星光·Starlight</title>
<base href="/Starlight_CN/">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="starlight.css?v=20261108">
<style>
.lost { text-align: center; padding: 4rem 1rem 5rem; }
.lost h2 { font-size: 3.5rem; margin: 0 0 .5rem; }
.lost p { color: rgba(228, 225, 233, .65); margin: 0 0 2rem; }
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<header class="header">
    <h1>星光·Starlight</h1>
    <p class="tagline">首个为 <em>Among Us</em> 打造的安卓模组启动器</p>
</header>
<main class="container">
    <div class="lost">
        <h2>404</h2>
        <p>这颗星球不存在，或者已经飘走了。</p>
        <a class="download-btn" href="./">回到首页</a>
    </div>
</main>
<footer class="footer">
    <p>&copy; 2026 星光·Starlight</p>
</footer>
<script>
(function () {
    var canvas = document.getElementById('stars-canvas');
    var ctx = canvas.getContext('2d');
    var stars = [], N = 180;
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    for (var i = 0; i < N; i++) {
        stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.2,
            speed: Math.random() * 0.00008 + 0.00002, base: Math.random() * 0.5 + 0.3,
            phase: Math.random() * Math.PI * 2 });
    }
    var t = 0;
    function draw() {
        t += 0.02;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var j = 0; j < stars.length; j++) {
            var s = stars[j];
            ctx.beginPath();
            ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + (s.base + 0.25 * Math.sin(t + s.phase)) + ')';
            ctx.fill();
            s.y += s.speed;
            if (s.y > 1) { s.y = 0; s.x = Math.random(); }
        }
        requestAnimationFrame(draw);
    }
    resize(); window.addEventListener('resize', resize); draw();
})();
</script>
</body>
</html>
